version: 2

build:
    os: ubuntu-24.04
    tools:
        python: "3.13"
    commands:
        - pip install uv
        # this is a workaround since readthedocs does not support python 3.15 yet
        - uv python install 3.15
        - uv run --python 3.15 --no-dev --with pdoc pdoc src/qq_lib -d google -o $READTHEDOCS_OUTPUT/html